# Herdr plugin manifest for co-review.
#
# Installing this as a Herdr plugin gives you a "Co-review this PR" action and a
# GitHub-PR link handler: Ctrl+click a pull-request URL in any pane and co-review
# lays out the split-screen for it. The canonical entry point is still the shell
# command `co-review start <pr>`, run from inside your repo checkout.

id = "elkei24.co-review"
name = "co-review"
version = "1.6.0"
min_herdr_version = "0.8.0"
description = "Interactive, split-screen PR co-review between you and your AI agent."
platforms = ["linux", "macos"]

# On install, put a `co-review` binary in bin/: download the prebuilt release
# asset for this platform, or fall back to `cargo build` if Rust is available.
# So installing the plugin does not require a Rust toolchain.
[[build]]
command = ["bash", "scripts/install-binary.sh"]

# Invoked by the link handler; `start` reads the clicked PR URL and the pane's
# cwd from $HERDR_PLUGIN_CONTEXT_JSON. The wrapper restores a usable PATH
# (herdr runs plugin commands with a minimal one) and resolves the binary
# under $HERDR_PLUGIN_ROOT.
[[actions]]
id = "start-from-url"
title = "Co-review this pull request"
contexts = ["workspace", "pane"]
command = ["bash", "scripts/run-action.sh", "start"]

# Ctrl+click a GitHub PR URL anywhere to start a co-review for it.
[[link_handlers]]
id = "github-pr"
title = "Co-review this PR"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
action = "start-from-url"
