name: Release

on:
  push:
    branches: [main]

# Job-level permissions only; each job gets the least it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Stage 1: figure out the next version, update Cargo.toml/lock/CHANGELOG, tag,
  # and create the GitHub release (binaries are attached in stage 2).
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release / commenting on released PRs and issues.
      # The release commit itself is pushed over SSH via the deploy key, which
      # also lets it bypass a future branch ruleset (like herdr-title-sync).
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Stage 2: build a binary for each platform from the freshly-tagged commit and
  # upload it to the release. Runs only when stage 1 actually published one.
  binaries:
    name: ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            apt: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        shell: bash
        env:
          # Cross-compile toolchain for the aarch64-linux leg (ring needs a C
          # compiler for the target). Ignored by the native legs.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        id: pkg
        shell: bash
        run: |
          # Stable, version-less asset names so the install script can use the
          # `releases/latest/download/<name>` URL.
          name="co-review-${{ matrix.target }}"
          reldir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "dist/${name}.zip" "./${reldir}/co-review.exe" >/dev/null
          else
            tar -C "${reldir}" -czf "dist/${name}.tar.gz" co-review
          fi
          echo "asset=dist/${name}.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: ${{ steps.pkg.outputs.asset }}
