[package]
name = "co-review"
version = "1.5.0"
edition = "2021"
rust-version = "1.88"
description = "Interactive, split-screen PR co-review between you and your AI agent, inside Herdr."
license = "MIT"
repository = "https://github.com/elKei24/herdr-co-review"
readme = "README.md"
keywords = ["herdr", "code-review", "tui", "github", "agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "co_review"
path = "src/lib.rs"

[[bin]]
name = "co-review"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
crossterm = "0.28"
directories = "6"
fs4 = { version = "1.1", features = ["sync"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }
toml = "1.1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
